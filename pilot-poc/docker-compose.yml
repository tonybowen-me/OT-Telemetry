# Run the two apps locally, exactly as they deploy on Render:
#   utility (DHALSIM water OT)  -> http://localhost:8001
#   pilot   (telemetry integrity) -> http://localhost:8002
#
#   docker compose up --build
#
# Open the PILOT app (8002), then open the utility HMI (8001) and arm an attack;
# watch PILOT react live while the utility's own screen stays green.
services:
  utility:
    build: .
    command: sh -c "uvicorn lab.service:app --host 0.0.0.0 --port 8001"
    ports:
      - "8001:8001"

  pilot:
    build: .
    command: sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8002"
    environment:
      - LAB_URL=http://utility:8001
    ports:
      - "8002:8002"
    depends_on:
      - utility
